name: Semver Tagging

on:
  push:
    tags:
      - v*

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  tag-main-with-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Docker pull
        run: |
          docker pull ${DOCKER_REGISTRY}/navigator-embeddings-generation:main-${GITHUB_SHA::8}

      - name: Docker retag locally
        run: |
          docker tag ${DOCKER_REGISTRY}/navigator-embeddings-generation:main-${GITHUB_SHA::8}  navigator-embeddings-generation:main-${GITHUB_SHA::8}

      - name: Docker push
        run: |
          .github/retag-and-push.sh navigator-embeddings-generation main-${GITHUB_SHA::8}

      - name: Clean up Docker
        if: always()
        run: |
          docker system prune -af --volumes || true
